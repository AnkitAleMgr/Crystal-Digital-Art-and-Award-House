  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' http://localhost:3000 https://api.cloudinary.com https://res.cloudinary.com; img-src 'self' data: blob: https://res.cloudinary.com https://fonts.gstatic.com; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-src https://www.google.com; media-src 'self' blob: https://res.cloudinary.com; object-src 'none'; base-uri 'self'; form-action 'self';">
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      <!-- On-page SEO: static defaults for the first paint; each route then
           overwrites these after mount via client/utils/seo.ts applyPageMeta(). -->
      <title>Crystal Digital Art &amp; Award House | Crystal Awards &amp; Trophies Nepal</title>
      <meta name="description" content="Crystal Digital Art &amp; Award House in Nepal: custom crystal awards, trophies, plaques, medals and engraved corporate gifts with free design support and bulk orders." />
      <meta name="robots" content="index, follow" />
      <meta name="theme-color" content="#2563EB" />
      <link rel="icon" type="image/png" href="/favicon.png" />
      <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
      <link rel="canonical" href="https://crystaldigital.com.np/" />

      <!-- Open Graph / Twitter: what link previews show on WhatsApp, Facebook, X -->
      <meta property="og:type" content="website" />
      <meta property="og:site_name" content="Crystal Digital Art &amp; Award House" />
      <meta property="og:title" content="Crystal Digital Art &amp; Award House | Crystal Awards &amp; Trophies Nepal" />
      <meta property="og:description" content="Custom crystal awards, trophies, plaques, medals and engraved gifts in Nepal — designed, engraved and delivered for schools, corporates and events." />
      <meta property="og:url" content="https://crystaldigital.com.np/" />
      <meta property="og:image" content="https://res.cloudinary.com/ewtxaqxk/image/upload/f_auto,q_auto/v1791233584/crystal-digital/gallery/idea6.jpg" />
      <meta property="og:locale" content="en_US" />
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:title" content="Crystal Digital Art &amp; Award House | Crystal Awards &amp; Trophies Nepal" />
      <meta name="twitter:description" content="Custom crystal awards, trophies, plaques, medals and engraved gifts in Nepal — free design support and bulk orders." />
      <meta name="twitter:image" content="https://res.cloudinary.com/ewtxaqxk/image/upload/f_auto,q_auto/v1791233584/crystal-digital/gallery/idea6.jpg" />

      <!-- Fonts: preconnect opens the TLS connection while the HTML still parses,
           and the stylesheet is linked here rather than @import-ed from CSS so the
           browser discovers it immediately instead of after the main bundle CSS.
           Only the weights the site actually uses are requested. -->
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      />

      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
